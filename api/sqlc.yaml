version: "2"
sql:
  - engine: postgresql
    schema:
      - db/baseline/legacy_schema.sql
      - db/migrations
    queries: db/queries
    gen:
      go:
        package: dbgen
        out: internal/platform/dbgen
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          # School Network totals are NULL when too few people are behind them.
          - db_type: "network_cohort_count"
            go_type: { import: "github.com/jackc/pgx/v5/pgtype", type: "Int8" }
