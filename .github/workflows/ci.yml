name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-api:
    name: Go API vet + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maple
          POSTGRES_PASSWORD: maple_ci
          POSTGRES_DB: maple
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U maple -d maple"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://maple:maple_ci@localhost:5432/maple
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      # The Go API builds the whole schema itself (db/baseline then
      # db/migrations), so the database tests start from an empty Postgres.
      - name: Check formatting
        working-directory: api
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Check generated queries are up to date
        working-directory: api
        run: go tool sqlc diff
      - working-directory: api
        run: go vet ./...
      - name: Run tests, including the database tests
        working-directory: api
        env:
          MAPLE_TEST_DATABASE_URL: postgres://maple:maple_ci@localhost:5432/maple
        run: go test -race ./...

  mobile:
    name: Mobile app typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx expo lint
      - run: npm test -- --ci
      - name: Deployment build carries no mock data
        run: npm run check:no-mock
