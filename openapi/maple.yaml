openapi: 3.1.0
info:
  title: Maple API
  version: 0.7.0
  description: |
    The contract between the Maple apps and the Go API. Paths not listed here
    are still served by the Django API through the Go service's forwarder,
    under the same /api/v1/ prefix. Each module moved to Go is added here first.
servers:
  - url: http://localhost:8080
    description: Local Go API
security:
  - bearer: []
paths:
  /api/health/:
    get:
      summary: Service and database health
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The database is unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/v1/auth/token/:
    post:
      summary: Sign in with email and password
      description: Limited to 10 attempts per minute per IP address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/auth/token/refresh/:
    post:
      summary: Swap a refresh token for a new token pair
      description: Each refresh token works once. Reusing one returns 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout/:
    post:
      summary: Sign out by revoking the refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Signed out }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/me/:
    get:
      summary: The signed-in user, their school memberships and approved children
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/assessments/assessment/:
    get:
      summary: Assignments the user can see
      description: Staff see every assignment by colleagues in their schools, including drafts. Everyone else sees published ones only.
      parameters: [{ $ref: "#/components/parameters/Page" }]
      responses:
        "200":
          description: A page of assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create an assignment (school staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewAssessment" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assessment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/assessments/assessment/{id}/:
    get:
      summary: One assignment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assessment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assessments/submission/:
    get:
      summary: Submissions the user can see
      description: Students see their own. Staff see submissions from their schools.
      parameters: [{ $ref: "#/components/parameters/Page" }]
      responses:
        "200":
          description: A page of submissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Submit work for an assignment (students only, once per assignment)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSubmission" }
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/grading/records/:
    get:
      summary: Grades the user can see
      description: Students see their own, parents their approved children's, staff their schools'.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { name: student, in: query, required: false, description: "Parents only: one approved child's grades", schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: A page of grades
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GradePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Record or update the grade for a submission (school staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewGrade" }
      responses:
        "200":
          description: Grade updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grade" }
        "201":
          description: Grade recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grade" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/classes/:
    get:
      summary: Classes the user can see
      description: Leaders see their schools' classes, teachers the classes they teach, students (and approved parents) enrolled classes.
      parameters: [{ $ref: "#/components/parameters/Page" }]
      responses:
        "200":
          description: A page of classes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a class (school leaders only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewClass" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Class" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/classes/{id}/:
    get:
      summary: One class
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200":
          description: The class
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Class" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/classes/{id}/roster/:
    get:
      summary: Students enrolled in a class (its teacher and school leaders only)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200":
          description: The class and its students
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Roster" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/class-enrollments/:
    post:
      summary: Enrol a student of the school in a class (school leaders only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrolled_class, student]
              properties:
                enrolled_class: { type: integer, format: int64 }
                student: { type: integer, format: int64 }
      responses:
        "201": { description: Enrolled }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/attendance/daily/:
    get:
      summary: Register marks the user can see
      description: Staff see their schools' registers, students their own, parents their approved children's.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { name: record_date, in: query, schema: { type: string, format: date } }
        - { name: class, in: query, schema: { type: integer, format: int64 } }
        - { name: student, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: A page of marks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkPage" }
    post:
      summary: Save a class register for a day (the class teacher or a school leader)
      description: Saving again for the same students and date updates their marks, so retries are safe.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [saved, class, record_date]
                properties:
                  saved: { type: integer }
                  class: { type: integer, format: int64 }
                  record_date: { type: string, format: date }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No school term covers the date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/grading/subjects/:
    get:
      summary: Subject marks the user can see
      description: Staff see their schools'. Students and approved parents see marks only for terms whose report card is published.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { name: class, in: query, schema: { type: integer, format: int64 } }
        - { name: term, in: query, schema: { type: integer, format: int64 } }
        - { name: student, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: A page of subject marks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubjectMarkPage" }
    post:
      summary: Enter a class's marks for a term (class teacher or school leader)
      description: Formative out of 20 plus summative out of 80; the total and grade are worked out. Saving again updates. Marks behind a published report are locked (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarksRequest" }
      responses:
        "200": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No term, or the report is already published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/grading/reports/:
    get:
      summary: Report cards the user can see (families see published ones only)
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { name: term, in: query, schema: { type: integer, format: int64 } }
        - { name: student, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: A page of report cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportPage" }
  /api/v1/grading/reports/generate/:
    post:
      summary: Prepare draft report cards for a class (class teacher or school leader)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class]
              properties:
                class: { type: integer, format: int64 }
                term: { type: integer, format: int64 }
      responses:
        "200":
          description: Drafts written; published cards are left alone
          content:
            application/json:
              schema:
                type: object
                required: [generated, already_published, term]
                properties:
                  generated: { type: integer }
                  already_published: { type: integer }
                  term: { type: integer, format: int64 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No term
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/grading/reports/{id}/:
    get:
      summary: One report card with its subject marks
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200":
          description: The report card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Add remarks, or publish (head's remarks, promotion and publishing are for school leaders)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                class_teacher_remarks: { type: string, maxLength: 2000 }
                headteacher_remarks: { type: string, maxLength: 2000 }
                promotion_status: { type: string }
                is_published: { type: boolean }
      responses:
        "200":
          description: The updated report card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/scheduling/terms/:
    get:
      summary: Terms of the user's schools
      responses: { "200": { description: "{count, results: Term[]}" } }
    post:
      summary: Add a term (school leaders); making it active deactivates the others
      responses: { "201": { description: The term }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { description: Name already used } }
  /api/v1/scheduling/rooms/:
    get:
      summary: Rooms of the user's schools (staff)
      responses: { "200": { description: "{count, results: Room[]}" } }
    post:
      summary: Add a room (school leaders)
      responses: { "201": { description: The room }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/v1/scheduling/timetable/:
    get:
      summary: Timetable slots the user can see
      description: Leaders see their schools', teachers the lessons they teach, students and approved parents their classes'.
      parameters:
        - { name: day, in: query, description: "0 = Monday … 6 = Sunday", schema: { type: integer, minimum: 0, maximum: 6 } }
        - { name: class, in: query, schema: { type: integer, format: int64 } }
        - { name: term, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The slots
          content:
            application/json:
              schema:
                type: object
                required: [count, results]
                properties:
                  count: { type: integer }
                  results: { type: array, items: { $ref: "#/components/schemas/Slot" } }
    post:
      summary: Add a lesson to the timetable (school leaders); refuses clashes of class, teacher or room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class, term, day_of_week, start_time, end_time]
              properties:
                class: { type: integer, format: int64 }
                term: { type: integer, format: int64 }
                day_of_week: { type: integer, minimum: 0, maximum: 6 }
                start_time: { type: string, example: "08:00" }
                end_time: { type: string, example: "09:00" }
                room: { type: integer, format: int64 }
                teacher: { type: integer, format: int64, description: Defaults to the class teacher }
      responses:
        "201":
          description: The slot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Slot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Clash: {code: clash, detail, clashes[]}" }
  /api/v1/institutions/:
    get:
      summary: Schools the user belongs to
      responses: { "200": { description: "{count, results: Institution[]}" } }
    post:
      summary: Register a school; the caller becomes its headteacher
      responses: { "201": { description: The school }, "400": { $ref: "#/components/responses/BadRequest" } }
  /api/v1/institutions/{id}/:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
    patch:
      summary: Update a school's details (school leaders)
      responses: { "200": { description: The school }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/v1/institutions/{id}/bulk_invite/:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
    post:
      summary: Invite staff or students by email (school leaders)
      description: "Body {emails: string[], role}. New people get an account with no usable password and a pending membership."
      responses: { "200": { description: "{invited, role, detail}" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/v1/institution-memberships/:
    get:
      summary: Memberships the user can see (their own, plus their schools' for leaders)
      responses: { "200": { description: "{count, results: InstitutionMembership[]}" } }
  /api/v1/institution-memberships/{id}/:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
    patch:
      summary: Change a member's role or status (school leaders)
      responses: { "200": { description: The membership }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { description: Would remove the school's last active leader } }
  /api/v1/institution-memberships/{id}/accept/:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
    post:
      summary: Accept your own pending invitation
      responses: { "200": { description: The membership }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/v1/curriculum/full-tree/:
    get:
      summary: The course catalog (levels, classes, terms, subjects, topics, lessons)
      description: Public and cached for ten minutes. Same JSON shape as the Django catalog.
      security: []
      responses: { "200": { description: "{version, updatedAt, levels[]}" } }
  /api/v1/curriculum/countries/:
    get:
      summary: Countries
      responses: { "200": { description: "{count, results: Country[]}" }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /api/v1/curriculum/class-levels/:
    get:
      summary: Class levels (S1, S2 …)
      responses: { "200": { description: "{count, results: ClassLevel[]}" }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /api/v1/curriculum/subjects/:
    get:
      summary: Subjects with their topics
      responses:
        "200":
          description: "{count, results: CurriculumSubject[]}"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/curriculum/subjects/{id}/:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
    get:
      summary: One subject with its topics
      responses:
        "200":
          description: The subject
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurriculumSubject" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/curriculum/topics/:
    get:
      summary: Topics, optionally for one subject or class level
      parameters:
        - { name: subject, in: query, schema: { type: integer, format: int64 } }
        - { name: class_level, in: query, schema: { type: integer, format: int64 } }
      responses: { "200": { description: "{count, results: CurriculumTopic[]}" }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /api/v1/curriculum/topics/{id}/:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
    get:
      summary: One topic
      responses:
        "200":
          description: The topic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurriculumTopic" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/curriculum/topic-competencies/:
    get:
      summary: Competencies, optionally for one topic
      parameters: [{ name: topic, in: query, schema: { type: integer, format: int64 } }]
      responses: { "200": { description: "{count, results: Competency[]}" }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /api/v1/resources/:
    get:
      summary: Resources the user can see
      description: Platform-shared and marketplace resources, the libraries of the user's schools, and their own private resources.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { name: search, in: query, description: Matches title, description or author, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: subject, in: query, schema: { type: integer, format: int64 } }
        - { name: visibility, in: query, schema: { type: string, enum: [private, institution_only, platform_shared, marketplace_public] } }
        - { name: ordering, in: query, schema: { type: string, enum: [created_at, -created_at, rating, -rating, price, -price] } }
      responses:
        "200":
          description: A page of resources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourcePage" }
    post:
      summary: Add a resource by link (files go to /api/v1/resources-upload/upload/)
      description: School libraries need a staff membership there; platform sharing is for Maple administrators.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceInput" }
      responses:
        "201":
          description: The resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/resources/{id}/:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
    get:
      summary: One resource
      responses:
        "200":
          description: The resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Change a resource (its uploader)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceInput" }
      responses:
        "200":
          description: The resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove a resource (its uploader, or a leader of the owning school)
      responses: { "204": { description: Removed, with its class links }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/v1/resources/shared-resource-link/:
    get:
      summary: Resources shared with classes the user can see
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { name: target_class, in: query, schema: { type: integer, format: int64 } }
        - { name: resource, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: A page of class links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassResourcePage" }
    post:
      summary: Share a resource with a class (its teacher or the school's leaders)
      description: The resource must be platform-shared or in that school's library.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, target_class]
              properties:
                resource: { type: integer, format: int64 }
                target_class: { type: integer, format: int64 }
      responses:
        "201":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/resources/shared-resource-link/{id}/:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
    delete:
      summary: Stop sharing (whoever shared it, the class's teacher, or the school's leaders)
      responses: { "204": { description: Removed }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" } }
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number; 20 items per page
      schema: { type: integer, minimum: 1 }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: The request body is missing fields or is not valid JSON
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Wrong credentials, or a missing, invalid or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in, but not allowed to do this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Doesn't exist, or isn't visible to this user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit reached
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Slot:
      type: object
      required: [id, institution, term, assigned_class, class_title, day_of_week, start_time, end_time, room, room_name, teacher, teacher_name, is_draft]
      properties:
        id: { type: integer, format: int64 }
        institution: { type: integer, format: int64 }
        term: { type: integer, format: int64 }
        assigned_class: { type: integer, format: int64 }
        class_title: { type: string }
        day_of_week: { type: integer }
        start_time: { type: string }
        end_time: { type: string }
        room: { type: [integer, "null"], format: int64 }
        room_name: { type: string }
        teacher: { type: [integer, "null"], format: int64 }
        teacher_name: { type: string }
        is_draft: { type: boolean }
    SubjectMark:
      type: object
      required: [id, student, student_name, assigned_class, class_title, term, term_name, formative_score, summative_score, total_score, grade_letter, descriptor, teacher_remarks, finalized_by, finalized_at]
      properties:
        id: { type: integer, format: int64 }
        student: { type: integer, format: int64 }
        student_name: { type: string }
        assigned_class: { type: integer, format: int64 }
        class_title: { type: string }
        term: { type: integer, format: int64 }
        term_name: { type: string }
        formative_score: { $ref: "#/components/schemas/Decimal" }
        summative_score: { $ref: "#/components/schemas/Decimal" }
        total_score: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        grade_letter: { type: [string, "null"] }
        descriptor: { type: [string, "null"] }
        teacher_remarks: { type: [string, "null"] }
        finalized_by: { type: [integer, "null"], format: int64 }
        finalized_at: { type: string, format: date-time }
    MarksRequest:
      type: object
      required: [class, entries]
      properties:
        class: { type: integer, format: int64 }
        term: { type: integer, format: int64, description: Defaults to the current term }
        entries:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [student, formative_score, summative_score]
            properties:
              student: { type: integer, format: int64 }
              formative_score: { type: string, description: 0 to 20 }
              summative_score: { type: string, description: 0 to 80 }
              teacher_remarks: { type: string, maxLength: 2000 }
    Report:
      type: object
      required: [id, institution, student, student_name, term, term_name, overall_score, overall_grade_letter, promotion_status, class_teacher_remarks, headteacher_remarks, is_published, published_at, generated_at]
      properties:
        id: { type: integer, format: int64 }
        institution: { type: integer, format: int64 }
        student: { type: integer, format: int64 }
        student_name: { type: string }
        term: { type: integer, format: int64 }
        term_name: { type: string }
        overall_score: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        overall_grade_letter: { type: [string, "null"] }
        promotion_status: { type: [string, "null"] }
        class_teacher_remarks: { type: [string, "null"] }
        headteacher_remarks: { type: [string, "null"] }
        is_published: { type: boolean }
        published_at: { type: [string, "null"], format: date-time }
        generated_at: { type: string, format: date-time }
        subjects:
          type: array
          items: { $ref: "#/components/schemas/SubjectMark" }
    SubjectMarkPage:
      allOf:
        - { $ref: "#/components/schemas/PageMeta" }
        - type: object
          required: [results]
          properties:
            results: { type: array, items: { $ref: "#/components/schemas/SubjectMark" } }
    ReportPage:
      allOf:
        - { $ref: "#/components/schemas/PageMeta" }
        - type: object
          required: [results]
          properties:
            results: { type: array, items: { $ref: "#/components/schemas/Report" } }
    Class:
      type: object
      required: [id, institution, subject_name, class_level, class_level_name, teacher, teacher_name, title, visibility, is_published, created_at]
      properties:
        id: { type: integer, format: int64 }
        institution: { type: integer, format: int64 }
        subject: { type: [integer, "null"], format: int64 }
        subject_name: { type: string }
        class_level: { type: integer, format: int64 }
        class_level_name: { type: string }
        teacher: { type: integer, format: int64 }
        teacher_name: { type: string }
        title: { type: string }
        visibility: { type: string }
        is_published: { type: boolean }
        created_at: { type: string, format: date-time }
    NewClass:
      type: object
      required: [title, institution, class_level, teacher]
      properties:
        title: { type: string, maxLength: 255 }
        institution: { type: integer, format: int64 }
        class_level: { type: integer, format: int64 }
        teacher: { type: integer, format: int64 }
        is_published: { type: boolean }
    Roster:
      type: object
      required: [class, students]
      properties:
        class: { $ref: "#/components/schemas/Class" }
        students:
          type: array
          items:
            type: object
            required: [enrollment, student, student_name, enrolled_at]
            properties:
              enrollment: { type: integer, format: int64 }
              student: { type: integer, format: int64 }
              student_name: { type: string }
              enrolled_at: { type: string, format: date-time }
    MarkStatus:
      type: string
      enum: [present, late, authorized_absent, unauthorized_absent]
    Mark:
      type: object
      required: [id, institution, term, term_name, student, student_name, record_date, status, recorded_by, recorder_name, notes, created_at]
      properties:
        id: { type: integer, format: int64 }
        institution: { type: integer, format: int64 }
        term: { type: integer, format: int64 }
        term_name: { type: string }
        student: { type: integer, format: int64 }
        student_name: { type: string }
        record_date: { type: string, format: date }
        status: { $ref: "#/components/schemas/MarkStatus" }
        recorded_by: { type: [integer, "null"], format: int64 }
        recorder_name: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [class, record_date, entries]
      properties:
        class: { type: integer, format: int64 }
        record_date: { type: string, format: date }
        entries:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [student, status]
            properties:
              student: { type: integer, format: int64 }
              status: { $ref: "#/components/schemas/MarkStatus" }
              notes: { type: string, maxLength: 1000 }
    ClassPage:
      allOf:
        - { $ref: "#/components/schemas/PageMeta" }
        - type: object
          required: [results]
          properties:
            results: { type: array, items: { $ref: "#/components/schemas/Class" } }
    MarkPage:
      allOf:
        - { $ref: "#/components/schemas/PageMeta" }
        - type: object
          required: [results]
          properties:
            results: { type: array, items: { $ref: "#/components/schemas/Mark" } }
    Decimal:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: A decimal with two places, such as "85.00"
    Question:
      type: object
      required: [id, type, content, marks, order, options]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        content: { type: string }
        marks: { $ref: "#/components/schemas/Decimal" }
        order: { type: integer }
        options: {}
        correct_answer: { type: string, description: Staff only }
    Assessment:
      type: object
      required: [id, title, instructions, type, source, max_score, is_published, created_at, created_by, questions]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        instructions: { type: string }
        type: { type: string }
        source: { type: string }
        max_score: { $ref: "#/components/schemas/Decimal" }
        is_published: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: [integer, "null"], format: int64 }
        target_group: { type: [integer, "null"], format: int64 }
        term: { type: [integer, "null"], format: int64 }
        topic: { type: [integer, "null"], format: int64 }
        window: { type: [integer, "null"], format: int64 }
        questions:
          type: array
          items: { $ref: "#/components/schemas/Question" }
    NewAssessment:
      type: object
      required: [title, instructions]
      properties:
        title: { type: string, maxLength: 255 }
        instructions: { type: string, maxLength: 20000 }
        type: { type: string, enum: [assignment, quiz, test, exam, exercise], default: assignment }
        max_score: { type: string, description: "Defaults to 100" }
        is_published: { type: boolean, default: false }
    Submission:
      type: object
      required: [id, assessment, student, status, submitted_at, answers_data, total_score]
      properties:
        id: { type: integer, format: int64 }
        assessment: { type: integer, format: int64 }
        student: { type: integer, format: int64 }
        status: { type: string, enum: [submitted, graded] }
        submitted_at: { type: [string, "null"], format: date-time }
        answers_data: { type: object, additionalProperties: true }
        total_score: { oneOf: [{ $ref: "#/components/schemas/Decimal" }, { type: "null" }] }
        assessment_title: { type: string }
        student_name: { type: string }
    NewSubmission:
      type: object
      required: [assessment]
      properties:
        assessment: { type: integer, format: int64 }
        answers_data: { type: object, additionalProperties: true }
    Grade:
      type: object
      required: [id, submission, score, teacher_feedback, graded_at]
      properties:
        id: { type: integer, format: int64 }
        submission: { type: integer, format: int64 }
        score: { $ref: "#/components/schemas/Decimal" }
        teacher_feedback: { type: [string, "null"] }
        graded_at: { type: string, format: date-time }
        assessment: { type: integer, format: int64 }
        assessment_title: { type: string }
        max_score: { $ref: "#/components/schemas/Decimal" }
        student: { type: integer, format: int64 }
        student_name: { type: string }
    NewGrade:
      type: object
      required: [submission, score]
      properties:
        submission: { type: integer, format: int64 }
        score: { type: string, description: "0 up to the assignment's maximum" }
        teacher_feedback: { type: string, maxLength: 5000 }
    AssessmentPage:
      allOf:
        - { $ref: "#/components/schemas/PageMeta" }
        - type: object
          required: [results]
          properties:
            results: { type: array, items: { $ref: "#/components/schemas/Assessment" } }
    SubmissionPage:
      allOf:
        - { $ref: "#/components/schemas/PageMeta" }
        - type: object
          required: [results]
          properties:
            results: { type: array, items: { $ref: "#/components/schemas/Submission" } }
    GradePage:
      allOf:
        - { $ref: "#/components/schemas/PageMeta" }
        - type: object
          required: [results]
          properties:
            results: { type: array, items: { $ref: "#/components/schemas/Grade" } }
    PageMeta:
      type: object
      required: [count, next, previous]
      properties:
        count: { type: integer }
        next: { type: [string, "null"] }
        previous: { type: [string, "null"] }
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
        code: { type: string }
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unreachable] }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refresh]
      additionalProperties: false
      properties:
        refresh: { type: string }
    TokenPair:
      type: object
      required: [access, refresh]
      properties:
        access: { type: string, description: "Short-lived access token (15 minutes by default)" }
        refresh: { type: string, description: "Refresh token (7 days by default)" }
    Role:
      type: string
      enum: [student, teacher, parent, admin, institution]
    Membership:
      type: object
      required: [institution_id, institution_name, role, status]
      properties:
        institution_id: { type: integer, format: int64 }
        institution_name: { type: string }
        role: { type: string, description: "Role inside the school, such as headteacher or class_teacher" }
        status: { type: string, enum: [pending, active, suspended] }
    Child:
      type: object
      required: [user_id, full_name, relationship]
      properties:
        user_id: { type: integer, format: int64 }
        full_name: { type: string }
        relationship: { type: string }
    Me:
      type: object
      required: [id, email, full_name, role, country_code, memberships, children]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        country_code: { type: string }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
        children:
          type: array
          description: Only children linked through an approved guardian link
          items: { $ref: "#/components/schemas/Child" }
    CurriculumTopic:
      type: object
      required: [id, name, order, class_level_name, subject, class_level]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        order: { type: integer }
        class_level_name: { type: string }
        subject: { type: integer, format: int64 }
        class_level: { type: integer, format: int64 }
    CurriculumSubject:
      type: object
      required: [id, name, code, category, topics]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        code: { type: [string, "null"] }
        category: { type: [string, "null"] }
        topics:
          type: array
          items: { $ref: "#/components/schemas/CurriculumTopic" }
    Resource:
      type: object
      required: [id, title, description, author, author_name, category, price, rating, is_featured, file_path, external_url, visibility, subject, class_level, topic, uploaded_by, owner_type, owner_institution, created_at, vimeo_video_id]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: [string, "null"] }
        author: { type: [string, "null"] }
        author_name: { type: string }
        category: { type: [string, "null"] }
        price: { type: string, description: Two-place decimal }
        rating: { type: string, description: Two-place decimal }
        is_featured: { type: boolean }
        file_path: { type: [string, "null"], description: "Path under the server's /media/ for uploaded files" }
        external_url: { type: [string, "null"] }
        visibility: { type: string, enum: [private, institution_only, platform_shared, marketplace_public] }
        subject: { type: [integer, "null"], format: int64 }
        class_level: { type: [integer, "null"], format: int64 }
        topic: { type: [integer, "null"], format: int64 }
        uploaded_by: { type: integer, format: int64 }
        owner_type: { type: string, enum: [platform, institution, teacher] }
        owner_institution: { type: [integer, "null"], format: int64 }
        created_at: { type: string, format: date-time }
        vimeo_video_id: { type: [string, "null"] }
    ResourceInput:
      type: object
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: [string, "null"] }
        author: { type: [string, "null"] }
        category: { type: [string, "null"] }
        external_url: { type: [string, "null"], format: uri }
        visibility: { type: string, enum: [private, institution_only, platform_shared, marketplace_public] }
        owner_institution: { type: [integer, "null"], format: int64 }
        subject: { type: [integer, "null"], format: int64 }
        class_level: { type: [integer, "null"], format: int64 }
        topic: { type: [integer, "null"], format: int64 }
        price: { type: number, description: Marketplace resources only }
    ResourcePage:
      type: object
      required: [count, next, previous, results]
      properties:
        count: { type: integer }
        next: { type: [string, "null"] }
        previous: { type: [string, "null"] }
        results:
          type: array
          items: { $ref: "#/components/schemas/Resource" }
    ClassResource:
      type: object
      required: [id, added_at, added_by, resource, target_class, resource_title]
      properties:
        id: { type: integer, format: int64 }
        added_at: { type: string, format: date-time }
        added_by: { type: integer, format: int64 }
        resource: { type: integer, format: int64 }
        target_class: { type: integer, format: int64 }
        resource_title: { type: string }
    ClassResourcePage:
      type: object
      required: [count, next, previous, results]
      properties:
        count: { type: integer }
        next: { type: [string, "null"] }
        previous: { type: [string, "null"] }
        results:
          type: array
          items: { $ref: "#/components/schemas/ClassResource" }
