# Maple Global Online School: Postgres and the Go API.
#
#   cp .env.example .env    # then set JWT_SIGNING_KEY and FINANCE_WEBHOOK_SECRET
#   docker compose up --build
#
# The API creates and migrates the whole schema on start. The app (Expo, in
# mobile/) talks to it on http://localhost:8080.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maple}
      POSTGRES_USER: ${POSTGRES_USER:-maple}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maple} -d ${POSTGRES_DB:-maple}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-maple}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maple}?sslmode=disable
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      APP_URL: ${APP_URL:-http://localhost:8081}
      APP_ENV: ${APP_ENV:-development}
      FINANCE_SANDBOX: ${FINANCE_SANDBOX:-true}
      FINANCE_WEBHOOK_SECRET: ${FINANCE_WEBHOOK_SECRET:?set FINANCE_WEBHOOK_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@maple.school}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
